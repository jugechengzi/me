name: /anvme/workspace/b270dd10-rlselector_new/b270dd10-rlselector-1783653062/hf/Llama-3-8B-Instruct
alias: llama3-8b-instruct

memit_joint:
  target_loss_mode: hidden_mse
  # null keeps uniform context weighting; set 0.5 for a 50/50 split between
  # the original prompt and all generated context prompts in E2E CE mode.
  original_prompt_loss_share: null
  # Active only when target_loss_mode=end_to_end_ce. This matches the
  # compute_z subject probe and linearly warms AdamW up over the first epochs.
  e2e_subject_kl_factor: 0.0625
  # Optional E2E-only subject-prompt-last hidden-state preservation. "edit"
  # monitors every configured rewrite layer; use "downstream", "all", or an
  # explicit list for broader coverage. A zero factor preserves historical
  # behavior.
  e2e_hidden_drift_factor: 0.0
  e2e_hidden_drift_layers: edit
  e2e_hidden_drift_normalize: true
  e2e_warmup_epochs: 5
  gd_lr: 1.0e-4
  gd_weight_decay: 0.0
  joint_epochs: 300
  alpha: 4.0
  gd_max_grad_norm: 100.0
  layer_norm_mode: none
  layer_norm_beta: 0.0
  layer_update_max_ratio: 0.15

# Independent all-Transformer-layer LoRA editor (algs=memit_lora).
# The preservation term is an unnormalized sum over every target module, so
# its coefficient is intentionally much smaller than memit_joint.alpha.
memit_lora:
  layers: all
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  rank: 16
  lora_alpha: 16.0
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 40
  micro_batch_size: 8
  max_grad_norm: 100.0
  preservation_alpha: 1.0e-3
  original_prompt_loss_share: 0.5
  covariance_cache_namespace: lora-all-linear
  covariance_manifests: []
  covariance_device: cuda
  checkpoint_interval: 5

memit_ori:
  L2: 0.0

##### for WISE ####
## alternative: WISE-Merge, WISE-Retrieve
# for merge (if merge)
densities: 0.53
weights: 1.0

# for retrieve (if retrieve, pls set to True)
retrieve: False
replay: False # True --> will replay the past editing instances: see https://arxiv.org/abs/2405.14768 Appendix B.3

model_parallel: False
use_chat_template: True
hidden_act: ''

mask_ratio: 0.2
edit_lr: 0.9
n_iter: 30
norm_constraint: 1.0
act_margin: [2.0, 20.0, 10.0] # alpha, beta, gamma
alpha: 2.0
beta: 20.0
gamma: 10.0
act_ratio: 0.5
save_freq: 500
merge_freq: 1000
merge_alg: 'ties'
objective_optimization: 'only_label'
inner_params:
- model.layers[29].mlp.down_proj.weight
##### for WISE end #####

fact_token: subject_last

##### for FT start #####
lr: 5e-4
weight_decay: 0
num_steps: 25
lambda_reg: 0.01
##### for FT end #####

#### for LTI start ####
mid_kl_factor: 0.0425
last_kl_factor: 0.0625
nll_factor: 1
midlayers:
  - 15
constr_pos: subject
#### for LTI end ####

#### for RLEdit start ####
edit_modules:
- model.layers.22.mlp.gate_proj
- model.layers.23.mlp.gate_proj
- model.layers.24.mlp.gate_proj
- model.layers.25.mlp.gate_proj
- model.layers.26.mlp.gate_proj
- model.layers.27.mlp.gate_proj
- model.layers.28.mlp.gate_proj
- model.layers.29.mlp.gate_proj
- model.layers.30.mlp.gate_proj
- model.layers.22.mlp.up_proj
- model.layers.23.mlp.up_proj
- model.layers.24.mlp.up_proj
- model.layers.25.mlp.up_proj
- model.layers.26.mlp.up_proj
- model.layers.27.mlp.up_proj
- model.layers.28.mlp.up_proj
- model.layers.29.mlp.up_proj
- model.layers.30.mlp.up_proj
#### for RLEdit end ####

clamp_norm_factor: 0.75
v_num_grad_steps: 25
v_lr: 0.1
v_loss_layer: 31
v_weight_decay: 0.5
kl_factor: 0.0625

layers:
