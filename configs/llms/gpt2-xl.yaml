name: gpt2-xl

memit_joint:
  gd_lr: 1.0e-4
  gd_weight_decay: 0.0
  joint_epochs: 300
  alpha: 4.0
  gd_max_grad_norm: 100.0
  layer_norm_mode: none
  layer_norm_beta: 0.0
  layer_update_max_ratio: 0.15

memit_ori:
  L2: 0.0

fact_token: subject_last

clamp_norm_factor: 0.75
v_num_grad_steps: 20
v_lr: 5e-1
v_loss_layer: 47
v_weight_decay: 0.5
kl_factor: 0.0625

layers:
  - 13
  - 14
  - 15
  - 16
  - 17
mom2_update_weight:
  - 15000
  - 15000
  - 15000
  - 15000
  - 15000
layer_selection: all

rewrite_module_tmp: transformer.h.{}.mlp.c_proj
layer_module_tmp: transformer.h.{}
mlp_module_tmp: transformer.h.{}.mlp
attn_module_tmp: transformer.h.{}.attn
ln_f_module: transformer.ln_f
lm_head_module: lm_head

mom2_dataset: wikipedia
mom2_n_samples: 100000
mom2_dtype: float32
mom2_adjustment: true
mom2_maxseqlen:
